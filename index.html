<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WHO</title>

    <!-- Логотип во вкладке браузера (favicon). Файл нужно положить в
         public/favicon.svg — всё, что лежит в папке public в корне
         проекта (рядом с src), Vite отдаёт как есть по корневому пути "/". -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Фолбэк для браузеров, которые не понимают SVG-иконки (на всякий
         случай). Если добавишь PNG-версию логотипа — положи её тоже
         в public/ под именем favicon.png. -->
    <link rel="alternate icon" href="/favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=PT+Serif:ital@1&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
